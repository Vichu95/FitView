name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Windows 11, Python 3.12, Chrome 130, FitView 0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or terminal output
      render: text
